<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quilldown — WYSIWYG demo</title>
    <link rel="stylesheet" href="https://unpkg.com/@xmsbl/quilldown-wysiwyg/index.css" />
    <style>
      body {
        margin: 0;
        font:
          15px/1.6 system-ui,
          sans-serif;
      }
      header {
        display: flex;
        gap: 1rem;
        align-items: center;
        padding: 0.6rem 1rem;
        border-bottom: 1px solid #ddd;
      }
      header a {
        margin-left: auto;
      }
      #editor {
        max-width: 820px;
        margin: 1.5rem auto;
      }
      pre.out {
        max-width: 820px;
        margin: 0 auto 3rem;
        padding: 1rem;
        background: #f6f8fa;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <!--
      NOTE FOR AI (see examples/AI-CONTRACT.md):
      This page loads the PUBLISHED build from unpkg. Edit the create() call and the DOM only.
      Do NOT re-implement library features in page JS.
    -->
    <header>
      <strong>Quilldown · wysiwyg</strong>
      <span id="stat"></span>
      <a href="./split.html">split demo →</a>
    </header>

    <div id="editor"></div>
    <pre class="out" id="out"></pre>

    <script src="https://unpkg.com/@xmsbl/quilldown-core/dist/index.iife.js"></script>
    <script src="https://unpkg.com/@xmsbl/quilldown-wysiwyg/dist/index.iife.js"></script>
    <script>
      const out = document.getElementById("out");
      const stat = document.getElementById("stat");

      const editor = window.QuilldownWysiwyg.create(document.getElementById("editor"), {
        value: "# Quilldown\n\nDrop in an image, type `/`, make a table.\n",
        upload: (file) => Promise.resolve({ url: URL.createObjectURL(file), name: file.name }),
        onChange: (md, html) => {
          out.textContent = html;
          stat.textContent = `${md.length} chars md`;
        },
      });
      out.textContent = editor.getHtml();
    </script>
  </body>
</html>
