name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      # build 必须在 typecheck / test 前：跨包类型走各包 dist 的 d.ts（dist 不入库），
      # 且 core 的产物守卫读 dist/index.iife.js
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test
      # 发布前体检（publint + attw）也要真产物 → 排在 build 之后
      - run: npm run lint:pkg

      # 产物存档：不发布也能拿到三个包的 dist（含 IIFE 与 .d.ts）
      - uses: actions/upload-artifact@v4
        with:
          name: quilldown-dist
          path: packages/*/dist
          if-no-files-found: error
